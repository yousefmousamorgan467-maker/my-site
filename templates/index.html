<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 محرك الأغاني - استمع وحمّل</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            color: #fff; direction: rtl;
        }
        .container {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            border-radius: 30px; padding: 2rem; width: 90%; max-width: 700px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
        }
        h1 {
            text-align: center; font-size: 2.5rem; margin-bottom: 1.5rem;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .search-box { display: flex; gap: 10px; margin-bottom: 2rem; }
        .search-box input {
            flex: 1; padding: 15px 20px; border-radius: 50px; border: none; outline: none;
            font-size: 1.1rem; background: rgba(255,255,255,0.2); color: white;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); transition: 0.3s;
        }
        .search-box input::placeholder { color: #ddd; }
        .search-box input:focus { background: rgba(255,255,255,0.3); border-color: #ff7eb3; }
        .search-box button {
            padding: 15px 30px; border-radius: 50px; border: none;
            background: linear-gradient(45deg, #ff758c, #ff7eb3); color: white;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .search-box button:hover { transform: scale(1.05); box-shadow: 0 0 20px #ff7eb3; }
        .results { list-style: none; max-height: 400px; overflow-y: auto; }
        .song-item {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 15px 20px; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: space-between;
            transition: 0.3s; border: 1px solid rgba(255,255,255,0.2);
        }
        .song-item:hover { background: rgba(255,255,255,0.25); box-shadow: 0 0 15px rgba(255,118,136,0.5); }
        .song-info { flex: 1; min-width: 0; }
        .song-title { font-size: 1.2rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .song-duration { font-size: 0.9rem; color: #ccc; }
        .actions { display: flex; gap: 10px; margin-right: 15px; }
        .btn {
            padding: 10px 15px; border-radius: 50px; border: none; font-weight: bold;
            cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;
            text-decoration: none; font-size: 0.9rem;
        }
        .btn-play { background: #4CAF50; color: white; }
        .btn-play:hover { background: #45a049; box-shadow: 0 0 10px #4CAF50; }
        .btn-download { background: #2196F3; color: white; }
        .btn-download:hover { background: #0b7dda; box-shadow: 0 0 10px #2196F3; }
        .now-playing {
            margin-top: 1.5rem; background: rgba(0,0,0,0.4); border-radius: 20px;
            padding: 15px; text-align: center; display: none;
        }
        .now-playing.visible { display: block; }
        audio { width: 100%; margin-top: 10px; outline: none; }
        .loading { text-align: center; padding: 2rem; color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎶 محرك الأغاني</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="اكتب اسم الأغنية أو الفنان..." autocomplete="off">
            <button onclick="searchSongs()">🔍 بحث</button>
        </div>
        <ul class="results" id="resultsList"></ul>
        <div class="loading" id="loading" style="display: none;">⏳ جاري البحث...</div>
        <div class="now-playing" id="nowPlaying">
            <div>🎧 <span id="currentSongTitle"></span></div>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>
    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        const loadingDiv = document.getElementById('loading');
        const nowPlayingDiv = document.getElementById('nowPlaying');
        const audioPlayer = document.getElementById('audioPlayer');
        const currentSongTitle = document.getElementById('currentSongTitle');

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchSongs();
        });

        async function searchSongs() {
            const query = searchInput.value.trim();
            if (!query) return;
            resultsList.innerHTML = '';
            loadingDiv.style.display = 'block';
            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const songs = await response.json();
                loadingDiv.style.display = 'none';
                if (songs.length === 0) {
                    resultsList.innerHTML = '<li class="song-item">😔 لا توجد نتائج</li>';
                    return;
                }
                songs.forEach(song => {
                    const li = document.createElement('li');
                    li.className = 'song-item';
                    li.innerHTML = `
                        <div class="song-info">
                            <div class="song-title" title="${song.title}">${song.title}</div>
                            <div class="song-duration">⏱ ${song.duration}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-play" onclick="playAudio('${song.audio_url.replace(/'/g, "\\'")}', '${song.title.replace(/'/g, "\\'")}')">▶ استمع</button>
                            <a class="btn btn-download" href="/download?url=${encodeURIComponent(song.webpage_url)}" target="_blank">⬇ تحميل</a>
                        </div>
                    `;
                    resultsList.appendChild(li);
                });
            } catch (err) {
                loadingDiv.style.display = 'none';
                resultsList.innerHTML = '<li class="song-item">❌ حدث خطأ في الاتصال بالخادم</li>';
                console.error(err);
            }
        }

        function playAudio(audioUrl, title) {
            if (!audioUrl) {
                alert('عذراً، لا يمكن تشغيل هذا المقطع');
                return;
            }
            audioPlayer.src = audioUrl;
            currentSongTitle.textContent = title;
            nowPlayingDiv.classList.add('visible');
            audioPlayer.play();
        }
    </script>
</body>
</html>
